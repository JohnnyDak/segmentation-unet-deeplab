# Configuration par défaut — un fichier de ce type par run d'ablation
# (dupliquer et modifier `run_name`, `model.architecture`, `loss.type`)

run_name: "unet_dice"          # convention : <architecture>_<loss>

data:
  # Pointe vers les images pré-traitées (voir src/data/preprocess.py) :
  # déjà redimensionnées à image_size, beaucoup plus rapides à charger
  # que les originaux ISIC (jusqu'à 17 Mo/image, résolution non standardisée).
  images_dir: "data/processed/images"
  masks_dir: "data/processed/masks"
  image_size: 256               # doit correspondre à la taille utilisée par preprocess.py
  val_split: 0.15
  test_split: 0.15
  seed: 42

model:
  architecture: "unet"          # "unet" ou "deeplabv3"
  num_classes: 2                # lésion vs fond (binaire)
  base_filters: 32               # utilisé par UNet (voir src/models/unet.py)

loss:
  type: "dice"                  # "dice" | "cross_entropy" | "combo"
  combo_weights: [0.5, 0.5]     # utilisé seulement si type == "combo"

training:
  epochs: 50
  batch_size: 16
  learning_rate: 0.0001
  optimizer: "adam"
  early_stopping_patience: 8

output:
  experiment_dir: "experiments"